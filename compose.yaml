name: url-shortener

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-local-development-only-signing-key-change-before-deploy}"
      JWT_ISSUER: "${JWT_ISSUER:-url-shortener}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-url-shortener-api}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-shortener}:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/${POSTGRES_DB:-shortener}?sslmode=disable"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-shortener}"
      POSTGRES_USER: "${POSTGRES_USER:-shortener}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local_dev_password}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
